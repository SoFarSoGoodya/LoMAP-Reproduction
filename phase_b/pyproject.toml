[project]
name = "lomap-maze2d-reproduction"
version = "0.1.0"
description = "Local Maze2D LoMAP reproduction"
requires-python = ">=3.13,<3.14"
dependencies = [
    "einops==0.8.1",
    "faiss-cpu==1.12.0",
    "h5py==3.14.0",
    "matplotlib==3.11.2",
    "mujoco==3.3.7",
    "numpy==2.3.5",
    "torch==2.15.0",
    "torchvision==0.29.1",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
